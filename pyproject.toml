[project]
name = "cyberforge"
version = "0.1.0"
description = "Local social-engineering training simulator and scenario constructor"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.18,<2",
    "argon2-cffi>=25.1,<26",
    "pydantic>=2.12.5,<3",
    "pyside6>=6.10.1,<6.11",
    "sqlalchemy>=2.0,<2.1",
]

[project.scripts]
cyberforge = "cyberforge.main:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "pytest-qt>=4.5,<5",
    "ruff>=0.14,<0.15",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
