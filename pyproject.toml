[project]
name = "cyberforge"
version = "0.1.0"
description = "Local social-engineering training simulator and scenario constructor"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
cyberforge = "cyberforge.main:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8.4,<9", "ruff>=0.14,<0.15"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
