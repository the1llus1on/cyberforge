name: Python checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    name: checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.7'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libopengl0 libxkbcommon0 libdbus-1-3
      - run: uv sync --locked --python 3.12
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - name: Compact Web native layout gate
        run: uv run --locked pytest tests/ui/test_web_constructor.py -k "compact or long_valid_tab_title" -q --tb=long
      - name: Scenario integration layout and browser lifecycle gate
        run: uv run --locked pytest tests/ui/test_scenario_integration.py -k "compact_page or actual_constructor_button or resizing_keyboard" -q --tb=long
      - name: Learner simulation native layout and lifecycle gate
        run: uv run --locked pytest tests/ui/test_learner_simulation.py -q --tb=long
      - run: uv run --locked pytest
      - name: Package import and Qt event-loop smoke
        run: |
          uv run --locked python -I -c "import cyberforge"
          uv run --locked cyberforge --database "${{ runner.temp }}/cyberforge-ci-smoke.sqlite3" --smoke-test
  windows-artifacts:
    name: Windows package and portable smoke
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.7'
      - name: Install signed portable Inno Setup compiler
        shell: pwsh
        run: ./release/windows/install_compiler.ps1 -Destination "${{ runner.temp }}/cyberforge-inno"
      - name: Build and smoke-test exact source archive
        shell: pwsh
        run: |
          $sha = (git rev-parse HEAD).Trim()
          if (git status --porcelain) { throw "Dirty source checkout" }
          $archive = "${{ runner.temp }}/cyberforge-source.tar"
          git archive --format=tar "--output=$archive" $sha
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $uv = (Get-Command uv).Source
          uv run --no-project --python 3.12.16 python release/windows/build_release.py --archive $archive --sha $sha --output "${{ runner.temp }}/cyberforge-artifacts" --uv $uv --iscc "${{ runner.temp }}/cyberforge-inno/ISCC.exe" --hosted-ci
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        with:
          name: cyberforge-windows-ci-artifacts
          path: ${{ runner.temp }}/cyberforge-artifacts
          if-no-files-found: error
          compression-level: 0
