name: Python checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    name: checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.7'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libopengl0 libxkbcommon0 libdbus-1-3
      - run: uv sync --locked --python 3.12
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - name: Compact Web native layout gate
        run: uv run --locked pytest tests/ui/test_web_constructor.py -k "compact or long_valid_tab_title" -q --tb=long
      - name: Scenario integration layout and browser lifecycle gate
        run: uv run --locked pytest tests/ui/test_scenario_integration.py -k "compact_page or actual_constructor_button or resizing_keyboard" -q --tb=long
      - name: Learner simulation native layout and lifecycle gate
        run: uv run --locked pytest tests/ui/test_learner_simulation.py -q --tb=long
      - run: uv run --locked pytest
      - name: Package import and Qt event-loop smoke
        run: |
          uv run --locked python -I -c "import cyberforge"
          uv run --locked cyberforge --database "${{ runner.temp }}/cyberforge-ci-smoke.sqlite3" --smoke-test
